<!-- カード裏／スタートプレイヤーマーカーの中央エンブレム（CrestEmblem）と同じ意匠:
     白の円環＋金の流星十字（背景なし）。アプリ側のパス・配色を変えたらここも揃える。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="mn-star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="rgb(246,224,66)"/>
      <stop offset="0.55" stop-color="rgb(249,238,149)"/>
      <stop offset="1"    stop-color="rgb(255,255,255)"/>
    </radialGradient>
    <filter id="mn-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="rgb(255,248,196)" flood-opacity="0.7"/>
    </filter>
  </defs>
  <path fill-rule="evenodd" fill="rgb(255,255,255)" fill-opacity="0.9" transform="rotate(45 50 50)"
        d="M23.5,50 a26.5,29.5 0 1,0 53,0 a26.5,29.5 0 1,0 -53,0 Z M24.5,50 a25.5,22.5 0 1,0 51,0 a25.5,22.5 0 1,0 -51,0 Z"/>
  <path filter="url(#mn-glow)" fill="url(#mn-star)" stroke="rgb(0,0,0)" stroke-width="1.5" stroke-linejoin="round"
        d="M48.00,9.30 Q50,8 52.00,9.30 C50.60,37.79 61.01,49.40 86.70,48.00 Q88,50 86.70,52.00 C61.01,50.60 50.60,62.21 52.00,90.70 Q50,92 48.00,90.70 C49.40,62.21 38.99,50.60 13.30,52.00 Q12,50 13.30,48.00 C38.99,49.40 49.40,37.79 48.00,9.30Z"/>
</svg>
